name: Release Starlight Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      notes:
        description: "Optional release notes"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build zip and latest.json
        run: node scripts/release.js --repo "${{ github.repository }}" --notes "${{ github.event.inputs.notes || format('Release {0}', github.ref_name) }}" --out dist
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/latest.json
